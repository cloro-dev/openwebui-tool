# Runs the tests on each pull request and on each push to main.
# Branch protection on main requires the "test" checks of this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Open WebUI supports Python 3.11 and 3.12.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          # The repository has no dependency file for the cache key.
          enable-cache: false
      - name: Run the tests
        run: uv run --with pytest --with httpx --with pydantic pytest -q
